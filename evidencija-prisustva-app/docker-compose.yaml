services:
  db:
    image: postgres:17
    container_name: evidencija_db
    environment:
      POSTGRES_USER: evidencija_prisustva_admin
      POSTGRES_PASSWORD: evidencija_prisustva_pass
      POSTGRES_DB: evidencija_prisustva_db
    ports:
      - "15432:5432"
    volumes:
      - evidencija_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: evidencija_backend
    environment:
      DATABASE_URL: postgresql://evidencija_prisustva_admin:evidencija_prisustva_pass@db:5432/evidencija_prisustva_db
      JWT_SECRET: neki_tajni_string
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: evidencija_frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  evidencija_pgdata: